<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b7895">
  <meta name="description" content="Quick access to employee attendance check-in and check-out.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Employee Attendance</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;background:#eef4f7;color:#183044;font:16px Arial,system-ui,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:#fff;border:1px solid #dce6ed;border-radius:20px;overflow:hidden;box-shadow:0 18px 55px #193c5618}.hero{padding:27px;background:linear-gradient(120deg,#087793,#0b86a3);color:white}.hero b{display:block;font-size:11px;letter-spacing:1.6px;color:#c8edf4}.hero h1{font-size:24px;margin:9px 0 0}.body{padding:25px}.body p{font-size:15px;line-height:1.55;color:#536a78;margin:0 0 20px}.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border:0;border-radius:10px;background:#087fa8;color:white;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer}.install{margin-top:12px;background:#eaf4f7;color:#087fa8;border:1px solid #d8eaf0}.hint{padding:0 25px 22px;color:#7a8992;font-size:12px;line-height:1.5}.icon{font-size:24px;margin-right:9px}@media(max-width:520px){body{padding:0;display:block;background:#fff}.card{width:100%;min-height:100vh;min-height:100dvh;border:0;border-radius:0;box-shadow:none;display:flex;flex-direction:column}.hero{padding:30px 23px}.hero h1{font-size:26px}.body{padding:28px 23px;flex:1}.body p{font-size:16px}.btn{min-height:58px;font-size:17px}.hint{padding:0 23px 25px}}
  </style>
</head>
<body>
  <main class="card">
    <header class="hero"><b>EMPLOYEE PORTAL</b><h1>Attendance</h1></header>
    <section class="body"><p>Use the button below to mark your attendance. Your registered email and current GPS location are required.</p><a class="btn" href="https://script.google.com/macros/s/AKfycbx0ZtBg-QPF_-8znyltwJ-qX--mzRjKrT8dkli9S9JJC03RLl3Wic2CXhtEKfIX-_XA/exec?page=attendance"><span class="icon">✓</span> Open Attendance Form</a><button class="btn install" id="install" hidden>Install on this phone</button></section>
    <footer class="hint">For attendance submissions, allow location access and keep an internet connection available.</footer>
  </main>
  <script>
    if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));let installPrompt;const button=document.getElementById('install');window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;button.hidden=false});button.addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;button.hidden=true});
  </script>
</body>
</html>
